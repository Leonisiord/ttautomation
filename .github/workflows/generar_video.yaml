name: Generar y subir short a TikTok
 
on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas
  workflow_dispatch: {}   # te deja lanzarlo también a mano desde la pestaña "Actions" de GitHub
 
# Si ya hay una ejecución en marcha (programada o manual), la siguiente
# espera en cola en vez de correr en paralelo — evita que dos ejecuciones
# se pisen al guardar los tokens de TikTok.
concurrency:
  group: generar-video
  cancel-in-progress: false
 
# "contents: write" hace falta para que, si algún día pones
# TIKTOK_UPLOAD_MODE = "review" en main_reddit.py, el pipeline pueda crear
# y subir assets a la GitHub Release "pending-review" con el CLI `gh`. En
# modo "draft" (el que usamos ahora) no se necesita, pero no molesta dejarlo.
permissions:
  contents: write
 
jobs:
  generar:
    runs-on: ubuntu-latest
    # Ahora cada ejecución genera y sube 2 o 3 vídeos (una historia en varias
    # partes), así que necesita más margen que cuando era solo uno.
    timeout-minutes: 45
 
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4
 
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
 
      - name: Instalar dependencias de Python
        run: pip install edge-tts python-dotenv google-genai requests pillow google-auth google-auth-oauthlib google-api-python-client
 
      - name: Instalar fuentes (para la tarjeta del gancho)
        run: sudo apt-get install -y fonts-liberation fontconfig
 
      # Los vídeos de fondo se guardan en caché para no descargarlos en cada
      # ejecución. Se descargan TODOS los assets del Release "video" cuyo
      # nombre empiece por "background" (background.mp4, background2.mp4,
      # background_jungle.mp4...), así que para añadir uno nuevo solo hace
      # falta subirlo a ese Release con ese prefijo — no hay que tocar este
      # archivo. ⚠️ Si añades o quitas un vídeo, sube el número de la "key"
      # de abajo (v1 → v2) para forzar que se vuelvan a descargar todos.
      - name: Restaurar vídeos de fondo desde caché
        id: cache-bg
        uses: actions/cache@v4
        with:
          path: backgrounds
          key: backgrounds-v1
 
      - name: Descargar vídeos de fondo (solo si no están en caché)
        if: steps.cache-bg.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p backgrounds
          gh release download video \
            --repo "${{ github.repository }}" \
            --pattern "background*.mp4" \
            --dir backgrounds \
            --clobber
          echo "Vídeos de fondo descargados:"
          ls -lh backgrounds/
 
      - name: Restaurar tokens de TikTok desde caché
        id: cache-tokens
        uses: actions/cache/restore@v4
        with:
          path: tiktok_tokens.json
          key: tiktok-tokens-${{ github.run_id }}
          restore-keys: |
            tiktok-tokens-
 
      - name: Usar los tokens guardados como secret si no hay caché todavía
        run: |
          if [ ! -f tiktok_tokens.json ]; then
            echo '${{ secrets.TIKTOK_TOKENS_JSON }}' > tiktok_tokens.json
          fi
 
      - name: Crear archivo .env con las claves
        run: |
          cat <<EOF > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          TIKTOK_CLIENT_KEY=${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET=${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI=${{ secrets.TIKTOK_REDIRECT_URI }}
          EOF
 
      # A diferencia de TikTok, el refresh_token de Google no cambia entre
      # ejecuciones (Google no lo rota), así que no hace falta cachearlo ni
      # guardarlo de vuelta — basta con recrear el archivo desde el secret
      # en cada ejecución.
      - name: Crear youtube_tokens.json desde el secret
        run: echo '${{ secrets.YOUTUBE_TOKENS_JSON }}' > youtube_tokens.json
 
      - name: Ejecutar el pipeline (genera y sube el short)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python main_reddit.py
 
      - name: Comprobar el estado real en TikTok
        if: always()
        run: |
          if [ -s last_publish_id.txt ]; then
            # Con 2-3 vídeos seguidos, TikTok tarda más en procesarlos a
            # todos que con uno solo — le damos más margen antes de mirar.
            sleep 60
            while IFS= read -r pid; do
              [ -z "$pid" ] && continue
              echo "── Comprobando $pid ──"
              python tiktok_check_status.py "$pid"
            done < last_publish_id.txt
          else
            echo "No hay ningún publish_id — ninguna subida llegó a completarse."
          fi
 
      - name: Guardar los tokens actualizados en caché para la próxima vez
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tiktok_tokens.json
          key: tiktok-tokens-${{ github.run_id }}
 
